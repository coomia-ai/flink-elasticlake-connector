pluginManagement { repositories { gradlePluginPortal(); mavenCentral() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        exclusiveContent {
            forRepository { maven { url = uri(providers.gradleProperty('connectorRepository').get()) } }
            filter {
                includeModule('io.elasticlake', 'elasticlake-flink-connector-1.20')
                includeModule('io.elasticlake', 'elasticlake-connector-recovery-s3')
            }
        }
        exclusiveContent {
            forRepository { maven { url = uri(providers.gradleProperty('sdkRepository').get()) } }
            filter { includeModule('io.elasticlake', 'elasticlake-client-api') }
        }
        mavenCentral()
    }
}
rootProject.name = 'relocated-connector-foundation-consumer'
