[versions]
flink = "1.20.3"
junit = "5.10.2"
jqwik = "1.8.4"
spotless = "6.25.0"
google-java-format = "1.22.0"
ktlint = "1.2.1"
sdk = "0.1.0-SNAPSHOT"
architecture-rules = "0.1.0-SNAPSHOT"

[libraries]
flink-streaming-java = { module = "org.apache.flink:flink-streaming-java", version.ref = "flink" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
elasticlake-client-api = { module = "io.elasticlake:elasticlake-client-api", version.ref = "sdk" }
elasticlake-client-http = { module = "io.elasticlake:elasticlake-client-http", version.ref = "sdk" }
elasticlake-architecture-rules = { module = "io.elasticlake:elasticlake-architecture-rules", version.ref = "architecture-rules" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
